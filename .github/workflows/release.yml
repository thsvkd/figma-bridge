name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  build-release:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package.json version
        run: node -e "const v=require('./package.json').version; const t=process.env.GITHUB_REF_NAME; if (t!=='v'+v) { console.error('tag', t, '!= v'+v); process.exit(1) }"

      - name: Package Windows
        run: |
          npm run build
          npx electron-builder --win --x64 --publish never

      - name: Verify packaged Windows app
        run: npm run smoke:packaged

      - name: Verify packaged MCP activation
        run: npm run smoke:mcp-packaged

      - name: Collect release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-win-x64
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-win-x64
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            release-assets/*-setup.exe
            release-assets/*-setup.exe.blockmap
            release-assets/latest.yml
